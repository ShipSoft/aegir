name: Coverage
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  coverage:
    permissions:
      contents: read
      id-token: write
    uses: ShipSoft/.github/.github/workflows/pixi-coverage.yml@main
