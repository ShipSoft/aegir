# Run with prek (https://github.com/j178/prek), a drop-in pre-commit replacement.
# The hook tools are provided by the pixi `lint` environment (see pixi.toml), so
# versions are tracked in pixi.lock and the hooks run identically everywhere.
#
#   pixi run install-hooks   # one-off: install the git hooks
#   pixi run lint            # run all hooks on all files
repos:
  # prek runs these as native Rust builtins (no environment, fully portable).
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: mixed-line-ending

  # Unit-safety fences (see docs/units.md). pygrep hooks fail on any match.
  - repo: local
    hooks:
      - id: forbid-hardcoded-c
        name: forbid hardcoded speed of light
        language: pygrep
        # Digit-anchored so it does not fire inside a longer number (e.g. a
        # seed like 12997924580 that merely contains the c digits).
        entry: '(?<![\d.])299792458(?!\d)|(?<!\d)299\.792458(?!\d)'
        types_or: [c++, c]

      - id: forbid-g4-system-of-units
        name: forbid G4SystemOfUnits.hh (use units/clhep_bridge.hpp)
        language: pygrep
        entry: 'G4SystemOfUnits\.hh'
        types_or: [c++, c]
        # The bridge's header comment documents this very ban.
        exclude: ^src/units/

      - id: forbid-clhep-units-outside-bridge
        name: forbid CLHEP units outside src/units/
        language: pygrep
        entry: 'CLHEP/Units/'
        types_or: [c++, c]
        exclude: ^src/units/

      - id: forbid-magic-unit-factors
        name: forbid hand-typed power-of-ten unit conversions
        language: pygrep
        # Any 1e{3,6,9}-style factor (decimal mantissa and f/l suffixes
        # included) next to a conversion comment (-> or "to"). The comment
        # marker keeps it from firing on unrelated powers of ten.
        entry: '(?<![\w.])[0-9]*\.?[0-9]+[eE]-?[369][fFlL]?\b.*//.*(->|\bto\b)'
        types_or: [c++, c]

  # Tools below come from the pixi `lint` environment via language: system.
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        language: system
        entry: ruff check --force-exclude
        args: [--fix, --show-fixes]
        types_or: [python]

      - id: ruff-format
        name: ruff format
        language: system
        entry: ruff format --force-exclude
        types_or: [python]

      - id: clang-format
        name: clang-format
        language: system
        entry: clang-format -i
        types_or: [c++, c]

      - id: cpplint
        name: cpplint
        language: system
        entry: cpplint
        types: [c++]

      - id: codespell
        name: codespell
        language: system
        entry: codespell
        types: [text]
        exclude: ^pixi\.lock$

      - id: validate-cff
        name: validate CITATION.cff
        language: system
        entry: cffconvert --validate
        files: ^CITATION\.cff$
        pass_filenames: false

      - id: reuse
        name: reuse lint
        language: system
        entry: reuse lint
        pass_filenames: false
        always_run: true

      - id: gersemi
        name: gersemi
        language: system
        entry: gersemi -i
        files: (\.cmake|CMakeLists\.txt)$

      - id: commitizen
        name: commitizen (conventional commits)
        language: system
        entry: cz check --commit-msg-file
        stages: [commit-msg]
