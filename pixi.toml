[workspace]
name = "aegir"
description = "Phlex-based simulation framework for the SHiP experiment"
channels = ["https://prefix.dev/ship-experiment/stable", "conda-forge"]
platforms = ["linux-64", "linux-aarch64"]
# Enables source dependencies for the (opt-in) multi-package dev workflow
# below; inert for the default environment.
preview = ["pixi-build"]
requires-pixi = ">=0.68"

[dependencies]
# SHiP/HEP packages (prefix.dev/ship-experiment/stable + conda-forge). NB: the three co-developed
# packages (shipdatamodel/shipgeometry/shipgeometryservice) are declared in
# [feature.released] just below — not here — so the opt-in `dev` environment can
# override them with sibling source builds without these channel specs in scope.
# >=0.4: the SHiP namespace, SHiP/FieldService/ headers and SHiP::FieldService*
# targets. The SHiP packages below are capped at the next minor, which may break
# the API while they are 0.x; keep each cap in step with the find_package range
# in CMakeLists.txt.
field-service-core = ">=0.4,<0.5"
field-service-g4 = ">=0.4,<0.5"
# Field-map file I/O (SHiP::FieldServiceMapIO), used by field_map_provider.
field-service-mapio = ">=0.4,<0.5"
# generate_constant_fieldmap, used by the field_deflection test.
field-service-tools = ">=0.4,<0.5"
phlex = ">=0.4.1"
root = ">=6.40"
# aegir/phlex are C++23 — pull the matching ROOT build variant.
root_cxx_standard = "==23"
geant4 = ">=11.3"
pythia8 = ">=8.312"
random123 = "*"
# SHiP::random::PhiloxRng, the generators' per-event RNG.
# ship-random accepts only the requested minor in find_package (SameMinorVersion),
# so keep this in step with find_package(SHiPRandom 0.4) in CMakeLists.txt.
ship-random = ">=0.4,<0.5"
libjsonnet = "*"
ship-ci-metrics = "*"

# C++ libraries
libboost-devel = "*"
tbb-devel = "*"
spdlog = "*"
# Required transitively by GeoModelCore's CMake config (find_dependency(Eigen3 ...));
# declared explicitly because conda-forge geomodel-core does not list it as a runtime dep.
eigen = "*"

# Build tools
cmake = ">=3.27"
ninja = "*"
cxx-compiler = "*"

# Static analysis. clang-tidy lives here rather than in [feature.lint] because
# it replays the commands in compile_commands.json and so needs the same
# headers the compiler saw; feature.lint is a separate solve group and could
# drift from them. clang-tools provides clang-tidy but does not depend on the
# clang package that ships clang's own builtin headers (stddef.h and friends),
# and without those every translation unit fails to parse.
# Both carry the >=19 floor that .clang-tidy's ExcludeHeaderFilterRegex needs,
# and they have to resolve to the same major: clang-tidy looks for its builtin
# headers under lib/clang/<major>/include, which is what the clang package
# supplies. Both come from the same llvm feedstock, so conda keeps them in step.
clang = ">=19"
clang-tools = ">=19"

# The three co-developed SHiP packages as their released conda builds
# (prefix.dev/ship-experiment/stable). Held in a feature the default/bench/lint environments pull
# in — deliberately NOT in the base [dependencies] — so the opt-in `dev`
# environment (path overrides in [feature.dev] below) sees no channel spec for
# them and builds them from the sibling source checkouts instead.
[feature.released.dependencies]
# >=0.6: the snake_case field names and helpers (mothers_are_consistent,
# mothers_are_populated, ...), the unit vocabulary in SHiP::units and
# SHiP::view, and the SHiP::DataModel/SHiP::Units targets. Older releases
# provide MCParticle::mothers (0.5) and SHiP/EventHeader.hpp (0.4), which the
# generator sources fill.
shipdatamodel = ">=0.6,<0.7"
shipgeometry = "*"
# >=0.6: geant4WorldLogical() returns G4LogicalVolume& and the pre-0.5
# spellings are gone. Its process-wide geometry thread and shared
# service registry are shared between geant4_module and any other Geant4
# geometry user (e.g. aegir-genie's GENIE source, its issue #11). Keep in
# lockstep with aegir-genie's pin: ld.so dedups the library process-wide and
# the first-loaded copy wins.
shipgeometryservice = ">=0.6,<0.7"

[activation]
scripts = ["activate.sh"]

[tasks]
configure = { cmd = """
cmake -S . -B build -G Ninja \
    -DCMAKE_BUILD_TYPE=Release \
    -DCMAKE_INSTALL_PREFIX=$CONDA_PREFIX \
    -DCMAKE_INSTALL_LIBDIR=lib \
    -DCMAKE_PREFIX_PATH=$CONDA_PREFIX \
""" }
build = { cmd = "cmake --build build -j", depends-on = ["configure"] }
install = { cmd = "cmake --install build", depends-on = ["build"] }
test = { cmd = "ctest --test-dir build --output-on-failure", depends-on = ["build"] }
smoke = { cmd = "scripts/smoke.sh", depends-on = ["build"] }
# Physics smoke: full Geant4 chain (100 events, deterministic seeding), then
# extract metrics from the validation histograms (see ci/metrics_config.yaml).
ci-physics-smoke = { cmd = "bash -c 'phlex -c <(jsonnet workflows/gun_st_nofield_smoke.jsonnet)'", depends-on = ["build"] }
ci-extract-metrics = "ship-metrics-extract . -o metrics-physics-smoke.json --pretty --config ci/metrics_config.yaml"
ci-render-plots = "ship-metrics-render gun_st_nofield_smoke_validation.root --output-dir plots/physics-smoke --job physics-smoke --config default"
clean = "rm -rf build"

# Static analysis. `clang-tidy` reports the whole tree, the same run CI does on
# a push. -source-filter is a Python regex (run-clang-tidy is a Python script),
# unlike the llvm::Regex patterns in .clang-tidy.
clang-tidy = { cmd = '''
run-clang-tidy -p build -j $(nproc) -quiet \
    -source-filter '^(?!.*(/G__|Dict[.]cxx|/_deps/|/CMakeFiles/)).*' \
    -extra-arg=-isystem$CONDA_PREFIX/include
''', depends-on = ["build"] }
# `clang-tidy-diff` is the quick local check on the sources you changed, not a
# copy of the gate: -only-check-in-db drops anything absent from
# compile_commands.json, so a header-only change prints "No relevant changes
# found" here while CI analyses the translation units that include the header.
# A clean run is therefore no promise; run the whole-tree task above after
# touching a header, and let CI have the last word.
# clang-tidy-diff.py ships with clang-tools but is not on PATH. Diffing against
# origin/main alone, with no second commit, includes staged and unstaged work, so
# this sees the patch in your tree rather than only what you have committed.
#
# It is a quick check, not the same thing CI does: clang-tidy-diff only looks at
# files in the compilation database, so a changed *header* is not analysed here.
# CI maps headers to the translation units that include them. For a header-only
# change, run `pixi run clang-tidy` or let CI report it.
#
# The diff goes to a file and the consumer reads it back, rather than the two
# being piped: pixi does not run tasks under `set -o pipefail`, so a failing
# `git diff` (no origin/main in a fresh or shallow clone, say) would otherwise be
# swallowed. clang-tidy-diff.py accepts the empty input and exits 0, reporting
# "No relevant changes found" about a tree it never looked at.
clang-tidy-diff = { cmd = '''
git diff --unified=0 --diff-filter=d origin/main -- '*.cpp' '*.hpp' '*.cxx' '*.h' \
    > build/clang-tidy-diff.patch \
  && python $CONDA_PREFIX/share/clang/clang-tidy-diff.py -p1 -path build -j $(nproc) \
      -quiet -only-check-in-db -extra-arg=-isystem$CONDA_PREFIX/include \
      < build/clang-tidy-diff.patch
''', depends-on = ["build"] }

[feature.bench.dependencies]
hyperfine = "*"
just = "*"
linux-perf = "*"

# Linting / formatting toolchain. prek orchestrates the hooks; the tools come
# from this environment so versions are tracked in pixi.lock and run identically
# everywhere (including NixOS). See .pre-commit-config.yaml.
[feature.lint.dependencies]
prek = "*"
python = ">=3.11"
ruff = "*"
clang-format = "23.*"
codespell = "*"
reuse = "*"
cffconvert = "*"
commitizen = "*"

# Pinned via PyPI to match the previous hook revs exactly: conda-forge's cpplint
# is stuck at 1.6.0 (a different, stale fork). gersemi is standardised on 0.27.7
# (the version used by the other SHiP repos; aegir previously pinned 0.17.1).
[feature.lint.pypi-dependencies]
cpplint = "==2.0.2"
gersemi = "==0.29.2"

[feature.lint.tasks]
lint = "prek run --all-files"
# Install the git hooks and route them through `pixi run` so the conda-provided
# hook tools are on PATH at commit time (required on NixOS, where the tools are
# not runnable without pixi activation).
install-hooks = '''
prek install --hook-type pre-commit --hook-type commit-msg
hooks=$(git rev-parse --git-path hooks)
sed -i 's#"$PREK" hook-impl#pixi run -e lint prek hook-impl#' "$hooks/pre-commit"
sed -i 's#"$PREK" hook-impl#pixi run -e lint prek hook-impl#' "$hooks/commit-msg"
'''

# --- Multi-package development (opt-in) -------------------------------------
# Build SHiP dependencies from sibling checkouts instead of the released conda
# packages: uncomment this block and the `dev` environment below, then run
# e.g. `pixi run -e dev build`. Requires the sibling checkouts referenced by
# the path entries; field-service (and phlex PR builds) come from the local
# channel ../ship-local-channel, populated with
# `pixi run build-local-channel` in the field_service checkout (or
# `pixi run build-phlex-pr <N>` in ship-conda-recipes).
# Do NOT commit the uncommented block or the pixi.lock changes it causes: the
# committed lock must stay resolvable without sibling checkouts, and pixi
# validates every environment even when only the default one is used.
# To test a colleague's PR without a local checkout, use a git spec instead:
#   shipdatamodel = { git = "https://github.com/ShipSoft/data-model", branch = "<pr-branch>" }
# When geometry and geometry_service are both path entries, also set
# `shipgeometry = { path = "../geometry" }` under [package.host-dependencies]
# in geometry_service's pixi.toml (do not commit that either). Otherwise it
# builds against the released shipgeometry, which can pin an older
# geomodel-core than ../geometry picks up, and the dev environment won't solve.
# See the Developer Guide (SHiP Documentation site) for the full workflow.
#
# [feature.dev]
# channels = [{ channel = "../ship-local-channel", priority = 10 }]
#
# [feature.dev.dependencies]
# shipdatamodel = { path = "../data-model" }
# shipgeometry = { path = "../geometry" }
# shipgeometryservice = { path = "../geometry_service" }

[environments]
default = { features = ["released"], solve-group = "default" }
bench = { features = ["bench", "released"], solve-group = "default" }
lint = { features = ["lint", "released"], solve-group = "lint" }
# dev = { features = ["dev"] }  # multi-package dev, see block above
